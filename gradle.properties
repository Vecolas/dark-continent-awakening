# Propriedades do build do Nen Foundation.
#
# DECISAO QUE ESTE ARQUIVO CARREGA: as versoes aqui sao PINADAS de proposito.
# Nenhuma delas sobe sozinha. Trocar qualquer uma exige passar pela matriz de
# QA em docs/testing/qa-matrix.md e registrar em docs/modpack/version-lock.md.
# Ver ADR-005.

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment: nomes de parametros legiveis em cima dos mappings oficiais.
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17

# --- Ambiente -----------------------------------------------------------
# NeoForge 1.21.1 exige Java 21. Ver docs/adr/ADR-005-versoes-pinadas.md [NF-1].
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Verificado em https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml
neo_version=21.1.250
loader_version_range=[1,)

# GeckoLib e infraestrutura obrigatoria do pipeline de entidades animadas.
# A excecao ao regime de integracoes opcionais esta no ADR-012.
geckolib_version=4.8.3

# --- Identidade do mod --------------------------------------------------
# CONGELADO. mod_id, group e namespace de recursos nao mudam depois que o
# primeiro save existir: eles ficam gravados em NBT, datapacks, quests e
# assets. Ver ADR-004.
mod_id=nenfoundation
mod_name=Nen Foundation
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.darkcontinent.nenfoundation

# --- Bibliotecas de teste ----------------------------------------------
junit_version=5.11.4
