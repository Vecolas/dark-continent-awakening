# CI do Nen Foundation.
#
# DECISOES QUE ESTE ARQUIVO CARREGA:
#
# 1. O CI e REDE DE SEGURANCA, nao primeira verificacao. Quem abre PR ja rodou
#    `./gradlew build` na maquina. O CI existe para pegar o que difere entre
#    ambientes -- e para impedir que a `main` fique vermelha enquanto a outra
#    pessoa espera.
#
# 2. Ele NAO roda o Minecraft. Nada aqui prova que o mod carrega em jogo. Isso
#    e `runClient` e `runServer`, na maquina de quem desenvolve. Ver
#    docs/testing/o-que-nao-provamos.md.
#
# 3. O relatorio de teste sobe como artefato mesmo quando o build falha. Sem
#    isso, "vermelho no CI" vira "vou rodar de novo na minha maquina para ver o
#    que foi".
#
# ARQUIVO HOSTIL A MERGE: uma pessoa por vez.

name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + testes + portoes
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # O NeoForge 1.21.1 exige Java 21. Fixado aqui de proposito: deixar o CI
      # escolher a versao faz o build passar na nuvem e falhar na maquina, ou
      # o contrario.
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, testes e portoes
        run: ./gradlew build --stacktrace

      # POR QUE ESTE PASSO EXISTE, e nao e redundante com o portao do
      # build.gradle:
      #
      # O portao do build.gradle roda no `doLast` da tarefa `test`. Quando o
      # Gradle resolve a tarefa como FROM-CACHE ou UP-TO-DATE, o `doLast` NAO
      # executa -- e a linha "Testes executados: N" simplesmente nao aparece no
      # log. Isso ja aconteceu aqui: uma reescrita de historico mudou so os
      # metadados dos commits, os inputs ficaram identicos, e o CI seguinte
      # trouxe `Task :test FROM-CACHE`.
      #
      # Cache nao e falso verde: o Gradle so reaproveita quando os inputs
      # batem, e a execucao anterior passou pelo portao. Mas quem le o log
      # perde a contagem, e "nao consigo ver o numero" e como um verde comeca a
      # ser confiado sem ser conferido.
      #
      # Este passo soma os relatorios XML, que existem tanto na execucao quanto
      # no cache, e REPROVA se o total for zero.
      # CANARIO TEMPORARIO -- nao mergear.
      # Apaga os relatorios para provar que o passo seguinte REPROVA.
      - name: Canario, apagar os relatorios
        run: rm -f build/test-results/test/TEST-*.xml

      - name: Contagem de testes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dir=build/test-results/test
          if [ ! -d "$dir" ]; then
            echo "::error::Nenhum diretorio de relatorio em $dir."
            exit 1
          fi
          total=0
          arquivos=0
          for xml in "$dir"/TEST-*.xml; do
            [ -e "$xml" ] || continue
            arquivos=$((arquivos + 1))
            n=$(sed -n 's/.*<testsuite[^>]*tests="\([0-9]*\)".*/\1/p' "$xml" | head -1)
            echo "  $(basename "$xml"): ${n:-0}"
            total=$((total + ${n:-0}))
          done
          echo "Relatorios: $arquivos | Testes executados: $total"
          if [ "$total" -eq 0 ]; then
            echo "::error::Zero testes. Suite vazia nao e aprovacao."
            exit 1
          fi
          echo "Testes executados: $total" >> "$GITHUB_STEP_SUMMARY"

      - name: Relatorio de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-testes
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 14
          if-no-files-found: warn

      - name: JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nenfoundation-jar
          path: build/libs/*.jar
          retention-days: 14
          if-no-files-found: error
