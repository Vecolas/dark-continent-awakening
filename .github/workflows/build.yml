# CI do Nen Foundation.
#
# DECISOES QUE ESTE ARQUIVO CARREGA:
#
# 1. O CI e REDE DE SEGURANCA, nao primeira verificacao. Quem abre PR ja rodou
#    `./gradlew build` na maquina. O CI existe para pegar o que difere entre
#    ambientes -- e para impedir que a `main` fique vermelha enquanto a outra
#    pessoa espera.
#
# 2. Ele NAO roda o Minecraft. Nada aqui prova que o mod carrega em jogo. Isso
#    e `runClient` e `runServer`, na maquina de quem desenvolve. Ver
#    docs/testing/o-que-nao-provamos.md.
#
# 3. O relatorio de teste sobe como artefato mesmo quando o build falha. Sem
#    isso, "vermelho no CI" vira "vou rodar de novo na minha maquina para ver o
#    que foi".
#
# ARQUIVO HOSTIL A MERGE: uma pessoa por vez.

name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + testes + portoes
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # O NeoForge 1.21.1 exige Java 21. Fixado aqui de proposito: deixar o CI
      # escolher a versao faz o build passar na nuvem e falhar na maquina, ou
      # o contrario.
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, testes e portoes
        run: ./gradlew build --stacktrace

      # `build` sai verde se nenhum teste executar? Nao: o proprio build.gradle
      # reprova nesse caso. Este passo existe so para deixar a contagem visivel
      # no log do CI, onde qualquer pessoa a confere sem baixar artefato.
      - name: Contagem de testes
        if: always()
        run: |
          echo "Relatorios encontrados:"
          find build/test-results/test -name '*.xml' -printf '%f\n' 2>/dev/null || true

      - name: Relatorio de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-testes
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 14
          if-no-files-found: warn

      - name: JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nenfoundation-jar
          path: build/libs/*.jar
          retention-days: 14
          if-no-files-found: error
